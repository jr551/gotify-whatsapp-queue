services:
  gotify:
    image: ghcr.io/gotify/server:2.7.3
    restart: unless-stopped
    ports:
      - "8008:80"
    environment:
      GOTIFY_DEFAULTUSER_NAME: ${GOTIFY_DEFAULTUSER_NAME:-admin}
      GOTIFY_DEFAULTUSER_PASS: ${GOTIFY_DEFAULTUSER_PASS:-admin}
    volumes:
      - gotify_data:/app/data

  connector:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      - gotify
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - wa_auth:/app/.data

volumes:
  gotify_data:
  wa_auth:
